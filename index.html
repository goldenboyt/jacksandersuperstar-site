<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#jacksandersuperstar®</title>
    <meta name="description" content="#jacksandersuperstar®" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .soboda-link {
        display: inline-flex;
        flex-direction: column;
        gap: 3px;
        padding: 9px 14px 8px;
        border: 1px solid #20231e;
        background: #f2f2ec;
        color: #20231e;
        text-decoration: none;
        transform: rotate(-2deg);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      .soboda-link__title {
        font-family: Impact, "Arial Narrow", Arial, sans-serif;
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -.045em;
      }
      .soboda-link__dot { color: #ae3425; }
      .soboda-link__caption {
        font: 8px/1.3 "Courier New", monospace;
        letter-spacing: .08em;
      }
      .soboda-link:hover { transform: rotate(0); box-shadow: 3px 3px 0 #ae3425; }
      .soboda-link:focus-visible { outline: 3px solid #ae3425; outline-offset: 4px; }
      .menu-list a.soboda-menu-link {
        margin-top: 8px;
        padding: 5px 9px;
        background: #f2f2ec;
        border-left: 3px solid #ae3425;
        color: #20231e;
        font-family: Impact, "Arial Narrow", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -.045em;
        text-transform: uppercase;
      }
      .menu-list a.soboda-menu-link:focus-visible { outline: 2px solid #ae3425; outline-offset: 3px; }
      .menu[open] .menu-list li:nth-child(4) { animation-delay: .42s; }
      @media (prefers-reduced-motion: reduce) {
        .soboda-link { transition: none; }
      }
    </style>
  </head>
  <body class="home">
    <main class="page page--home">
      <nav class="nav">
        <details class="menu">
          <summary class="menu-trigger" aria-label="menu">
            <span class="menu-icon" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </summary>
          <ul class="menu-list">
            <li><a href="index.html" aria-current="page">home</a></li>
            <li><a href="music.html">music</a></li>
            <li><a href="merch.html">merch</a></li>
            <li><a class="soboda-menu-link" href="/soboda">SOBODA<span class="soboda-link__dot" aria-hidden="true">.</span></a></li>
          </ul>
        </details>
      </nav>

      <div class="center">
        <header class="top top--home">
          <h1 class="logo-wrap">
            <a href="music.html" class="title-link">
              <img
                src="logo.png"
                alt="#jacksandersuperstar®"
                class="logo logo--hero"
                width="3284"
                height="308"
              />
            </a>
          </h1>
          <p class="countdown" id="countdown" aria-live="polite"></p>
          <nav class="home-links" aria-label="site links">
            <a class="stream-link" href="live.html">live in dallas</a>
            <a class="stream-link" href="merch.html">merch</a>
            <a class="stream-link" href="music.html">music</a>
            <a class="soboda-link" href="/soboda" aria-label="Soboda Discovery Center">
              <span class="soboda-link__title">SOBODA<span class="soboda-link__dot" aria-hidden="true">.</span></span>
              <span class="soboda-link__caption">DISCOVERY CENTER ↗</span>
            </a>
          </nav>
        </header>
      </div>

    </main>
